# Render Blueprint — 台股籌碼看板
# Dashboard → New → Blueprint → 連接 GitHub repo
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tw-market-dashboard
    runtime: node
    plan: free
    region: singapore
    # Build: Nitro node-server + SSR CSS fix (no Vercel preset)
    buildCommand: npm ci && npm run build:render
    # Start: migrate (if DATABASE_URL) then Nitro
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: "0.0.0.0"
      - key: NITRO_HOST
        value: "0.0.0.0"
      # GAS / 上傳 API 寫入保護（建議在 Dashboard 改成自己的密鑰）
      - key: MARKET_UPDATE_TOKEN
        generateValue: true
      # 可選：Neon / 外部 Postgres 連線字串（持久化每日資料）
      # - key: DATABASE_URL
      #   sync: false
