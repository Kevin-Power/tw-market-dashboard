# Render Blueprint — 台股籌碼看板
# https://dashboard.render.com → New → Blueprint
# Repo: https://github.com/Kevin-Power/tw-market-dashboard
services:
  - type: web
    name: tw-market-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: "0.0.0.0"
      - key: NITRO_HOST
        value: "0.0.0.0"
      # GAS / 外部 POST 用；看板同源上傳不需此 token
      - key: MARKET_UPDATE_TOKEN
        generateValue: true
      # 可選：Neon connection string（持久化每日資料）
      # 在 Dashboard 手動新增 DATABASE_URL 即可
